name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_NOLOGO: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-test-coverage:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Restore dependencies
        run: dotnet restore SmartLinks.sln

      - name: Build solution
        run: dotnet build SmartLinks.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: dotnet test SmartLinks.sln --configuration Release --no-build --no-restore --settings coverlet.runsettings --collect:"XPlat Code Coverage" --results-directory artifacts/test-results

      - name: Generate coverage report
        run: dotnet reportgenerator "-reports:artifacts/test-results/**/coverage.cobertura.xml" "-targetdir:artifacts/coverage-report" "-reporttypes:Html;MarkdownSummaryGithub;Cobertura" "-assemblyfilters:+SmartLinks.*;-*.Tests" "-filefilters:-*/Migrations/*"
        
      - name: Publish coverage summary
        run: cat artifacts/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: artifacts/coverage-report
          if-no-files-found: error
          retention-days: 14

      - name: Enforce line coverage threshold
        run: dotnet reportgenerator "-reports:artifacts/coverage-report/Cobertura.xml" "-targetdir:artifacts/coverage-threshold" "-reporttypes:TextSummary" "--minimumCoverageThresholds:lineCoverage=90"