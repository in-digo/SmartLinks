apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
  labels:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: smartlinks
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlinks-http-redirect
  labels:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: smartlinks
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: smartlinks-https-redirect@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "1"
spec:
  ingressClassName: traefik
  rules:
    - host: smartlinks-api.difingo.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartlinks-management
                port:
                  name: http
    - host: smartlinks-go.difingo.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartlinks-redirect
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlinks-management-https
  labels:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: management
    app.kubernetes.io/part-of: smartlinks
  annotations:
    cert-manager.io/issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - smartlinks-api.difingo.online
      secretName: smartlinks-management-tls
  rules:
    - host: smartlinks-api.difingo.online
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: smartlinks-management
                port:
                  name: http
          - path: /health/live
            pathType: Exact
            backend:
              service:
                name: smartlinks-management
                port:
                  name: http
          - path: /health/ready
            pathType: Exact
            backend:
              service:
                name: smartlinks-management
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartlinks-redirect-https
  labels:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: redirect
    app.kubernetes.io/part-of: smartlinks
  annotations:
    cert-manager.io/issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - smartlinks-go.difingo.online
      secretName: smartlinks-redirect-tls
  rules:
    - host: smartlinks-go.difingo.online
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartlinks-redirect
                port:
                  name: http