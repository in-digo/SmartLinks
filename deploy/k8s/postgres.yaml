apiVersion: v1
kind: Service
metadata:
  name: smartlinks-postgres
  labels:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: smartlinks
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: postgres
  ports:
    - name: postgresql
      protocol: TCP
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: smartlinks-postgres
  labels:
    app.kubernetes.io/name: smartlinks
    app.kubernetes.io/component: postgres
    app.kubernetes.io/part-of: smartlinks
spec:
  serviceName: smartlinks-postgres
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: smartlinks
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: smartlinks
        app.kubernetes.io/component: postgres
        app.kubernetes.io/part-of: smartlinks
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: smartlinks-postgres-config
          env:
            - name: POSTGRES_PASSWORD_FILE
              value: /var/run/secrets/smartlinks/postgres-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'exec pg_isready --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"'
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'exec pg_isready --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"'
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - 'exec pg_isready --username="$POSTGRES_USER" --dbname="$POSTGRES_DB"'
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-runtime
              mountPath: /var/run/postgresql
            - name: temporary-files
              mountPath: /tmp
            - name: runtime-secrets
              mountPath: /var/run/secrets/smartlinks
              readOnly: true
      volumes:
        - name: postgres-runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
        - name: runtime-secrets
          secret:
            secretName: smartlinks-runtime-secrets
            defaultMode: 0440
            items:
              - key: POSTGRES_PASSWORD
                path: postgres-password
      terminationGracePeriodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: smartlinks
          app.kubernetes.io/component: postgres
          app.kubernetes.io/part-of: smartlinks
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi