apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: smartlinks

resources:
  - namespace.yaml
  - configmaps.yaml
  - postgres.yaml
  - management-migrations.yaml
  - management.yaml
  - redirect.yaml
  - issuer.yaml
  - ingress.yaml

secretGenerator:
  - name: smartlinks-runtime-secrets
    envs:
      - secrets.env